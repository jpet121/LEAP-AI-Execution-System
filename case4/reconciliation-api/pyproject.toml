[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "case4-ledger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "psycopg[binary]>=3.2,<4", "uvicorn>=0.30,<1"]
[tool.setuptools]
packages = ["app"]
