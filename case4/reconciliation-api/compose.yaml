services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a local database password}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ledger -d ledger']
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD}@db:5432/ledger
    command: [python, -c, 'import os; from app.db import migrate; migrate(os.environ["DATABASE_URL"])']
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD}@db:5432/ledger
      LEDGER_API_KEY: ${LEDGER_API_KEY:?set a local API key}
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
