name: Portfolio integrity and frozen case evidence
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical source and case evidence
        run: python tools/verify_repo.py
      - name: Verify three exact exported runs
        run: python tools/verify_cases_1_3.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
